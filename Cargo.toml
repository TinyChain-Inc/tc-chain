[package]
name = "tc-chain"
version = "0.1.0"
edition = "2024"

[dependencies]
get-size = "0.1"
bytes = "1"
destream = { path = "../deps/destream" }
destream_json = { path = "../deps/destream_json", default-features = false }
freqfs = { path = "../deps/freqfs" }
futures = "0.3"
pathlink = { path = "../deps/pathlink", features = ["stream"] }
safecast = "0.2"
sha2 = "0.10"
tc-collection = { path = "../tc-collection" }
tc-error = { path = "../tc-error" }
tc-ir = { path = "../tc-ir" }
tc-value = { path = "../tc-value" }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

txn_lock = { path = "../deps/txn_lock" }

[dev-dependencies]
tc-state = { path = "../tc-state" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
